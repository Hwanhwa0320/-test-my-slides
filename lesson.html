<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>우리 반 나라 올림픽</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
/* Layout: one classroom TV screen. A paper header with the lesson steps, a string of bunting carrying every nation's flag, then one big stage per step. Single bright theme by choice. */
:root{
  --sky:#E8F1F8; --paper:#FFFFFF; --soft:#F2F7FB; --ink:#1C2A44; --muted:#56667F; --line:#C8D6E5;
  --red:#E4473A; --yellow:#F5C02E; --blue:#2C69D3; --green:#249960; --gold:#D99A08;
  --goldsoft:#FFF4CF; --greensoft:#E2F4EA; --scrim:rgba(232,241,248,.9); --shade:rgba(28,42,68,.45);
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Nanum Gothic','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --r:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:clamp(15px,.45vw + 11px,21px);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* header */
.top{background:var(--paper);border-bottom:3px solid var(--ink)}
.topbar{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand-mark{width:30px;height:36px;position:relative;flex:0 0 auto}
.brand-mark::before{content:"";position:absolute;left:2px;top:0;width:3px;height:100%;background:var(--ink);border-radius:2px}
.brand-mark::after{content:"";position:absolute;left:5px;top:2px;width:24px;height:17px;background:var(--red);clip-path:polygon(0 0,100% 50%,0 100%)}
.brand strong{font-family:var(--display);font-weight:400;font-size:1.35em;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.75em;letter-spacing:.03em}
.steps{display:flex;gap:4px;flex:1 1 auto;justify-content:center;flex-wrap:wrap;min-width:0}
.step{display:flex;align-items:center;gap:7px;border:2px solid transparent;background:none;border-radius:999px;padding:5px 14px 5px 5px;cursor:pointer;font-weight:800;white-space:nowrap;font-size:.92em}
.step i{font-style:normal;width:1.75em;height:1.75em;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:2px solid var(--line);font-family:var(--display);font-weight:400}
.step:hover{border-color:var(--line)}
.step.on{background:var(--ink);color:var(--paper)}
.step.on i{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.tools{display:flex;gap:8px;flex:0 0 auto}
.tool{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 12px;cursor:pointer;font-weight:800;font-size:.82em}
.tool[aria-pressed="false"]{color:var(--muted);background:var(--soft)}

/* bunting */
.bunting{height:84px}
.bunting-in{position:relative;height:100%}
.bunting-in svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bunting-in path{fill:none;stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke}
.pennant{position:absolute;height:clamp(26px,3.4vw,46px);aspect-ratio:3/2;padding:0;border:2px solid var(--ink);border-radius:3px;background:var(--paper);overflow:hidden;cursor:pointer;transform-origin:50% 0;transition:margin .15s}
.pennant:hover{margin-top:4px}
.pennant img{width:100%;height:100%;object-fit:cover;display:block}

/* page */
main{padding-block:8px 48px;max-width:1800px;margin:0 auto}
.page{display:flex;flex-direction:column;gap:20px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pagehead > div:first-child{min-width:0}
.headtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-weight:800;font-size:.8em;letter-spacing:.08em;color:var(--blue)}
h1{font-size:clamp(28px,2.2vw + 10px,56px)}
.lead{color:var(--muted);max-width:62ch;margin-top:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2.5px solid var(--ink);background:var(--paper);border-radius:14px;padding:.5em 1.1em;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{background:var(--red);color:var(--paper)}
.btn.ok{background:var(--green);color:var(--paper)}
.btn.danger{background:var(--red);color:var(--paper)}
.btn.big{font-family:var(--display);font-weight:400;font-size:clamp(20px,1.3vw + 9px,34px);padding:.4em 1.1em;border-radius:18px}
.btn.ghost{box-shadow:none;border-color:var(--line)}
.btn.ghost:active:not(:disabled){transform:translateY(1px);box-shadow:none}
.btn.sm{font-size:.85em;padding:.3em .8em}
.btn.ok.on{box-shadow:0 0 0 4px var(--yellow),0 4px 0 var(--ink)}
.btn.ghost.on{background:var(--soft);border-color:var(--muted)}
.link{background:none;border:0;padding:0;color:var(--blue);font-weight:800;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--red)}

/* setup */
.notice{background:var(--goldsoft);border:2px dashed var(--gold);border-radius:14px;padding:12px 16px}
.nation-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.ncard{background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.flagdrop{position:relative;display:block;aspect-ratio:3/2;border-radius:10px;overflow:hidden;border:2px solid var(--line);background:var(--paper);cursor:pointer}
.flagdrop img{width:100%;height:100%;object-fit:contain;display:block}
.flagdrop .dropcue{position:absolute;left:8px;right:8px;bottom:8px;background:var(--ink);color:var(--paper);border-radius:8px;text-align:center;font-weight:800;font-size:.8em;padding:4px;opacity:0;transition:opacity .15s}
.flagdrop.empty .dropcue,.flagdrop:hover .dropcue,.flagdrop.over .dropcue{opacity:.92}
.flagdrop.over{border:3px dashed var(--blue)}
.tag{position:absolute;top:8px;left:8px;background:var(--yellow);font-size:.7em;font-weight:800;padding:2px 8px;border-radius:999px}
.fields{display:flex;flex-direction:column;gap:6px}
.f{display:grid;grid-template-columns:5.4em minmax(0,1fr);align-items:center;gap:8px;font-size:.85em}
.f span{color:var(--muted);font-weight:800}
.f input{width:100%;min-width:0;border:2px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--soft)}
.f input:focus{border-color:var(--blue);outline:none;background:var(--paper)}
.cardfoot{display:flex;align-items:center;gap:12px;font-size:.8em}
.num{font-family:var(--display);width:1.9em;height:1.9em;display:grid;place-items:center;border-radius:50%;background:var(--ink);color:var(--paper);margin-right:auto;font-size:1.1em}

/* shared flag frame */
.flagframe{aspect-ratio:3/2;background:var(--paper);border:2.5px solid var(--ink);border-radius:10px;overflow:hidden;max-width:100%}
.flagframe img{width:100%;height:100%;object-fit:contain;display:block}
.flagframe.sm{border-width:2px;border-radius:6px}

/* ceremony */
.stage-body{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(20px,3vw,60px);align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:28px;padding:clamp(18px,3vw,48px)}
.bigflag .flagframe{width:min(100%,calc(54vh * 1.5));margin:0 auto;border-width:4px;border-radius:14px}
.stage-text{display:flex;flex-direction:column;gap:10px;min-width:0}
.kicker{font-weight:800;color:var(--red);font-size:1.1em}
.nation-title{font-size:clamp(40px,5vw,110px);overflow-wrap:anywhere}
.founder{font-size:1.3em}
.intro{font-family:var(--display);font-size:clamp(22px,1.8vw + 6px,44px);line-height:1.3;color:var(--blue)}
.stage-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.thumb{width:58px;aspect-ratio:3/2;padding:0;border:2.5px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;background:var(--paper);transition:transform .15s}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.on{border-color:var(--red);transform:translateY(-5px)}

/* versus games */
.versus{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:clamp(12px,2vw,36px);align-items:stretch}
.arena{background:var(--paper);border:3px solid var(--ink);border-radius:26px;padding:clamp(16px,1.6vw,28px);display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;min-width:0}
.arena.empty{border:3px dashed var(--line);justify-content:center;color:var(--muted)}
.arena .flagframe{width:min(100%,calc(24vh * 1.5))}
.ph{display:grid;place-items:center;text-align:center;font-weight:800;border:3px dashed var(--line);background:var(--soft);color:var(--muted);padding:8px}
.aname{font-family:var(--display);font-size:clamp(26px,2.3vw,52px);line-height:1.1;text-align:center;overflow-wrap:anywhere}
.akid{color:var(--muted);font-weight:800;margin-top:-8px}
.arena.win{background:var(--goldsoft);border-color:var(--gold);box-shadow:0 0 0 6px var(--yellow)}
.crown{position:absolute;top:-20px;background:var(--gold);color:var(--paper);font-family:var(--display);font-size:1.3em;padding:2px 20px;border-radius:999px;border:2.5px solid var(--ink)}
.vs{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.vs-label{font-family:var(--display);font-size:clamp(36px,4vw,84px);color:var(--red);line-height:1}
.vs small{color:var(--muted);font-weight:800}
.score{font-family:var(--display);font-size:clamp(44px,4.2vw,96px);display:flex;gap:.25em;line-height:1;font-variant-numeric:tabular-nums}
.score i{font-style:normal;color:var(--muted)}
.resultline{text-align:center;font-family:var(--display);font-size:clamp(22px,1.5vw + 8px,40px);min-height:1.4em}
.resultline b{color:var(--red);font-weight:400}
.die{--ds:clamp(96px,min(15vh,12vw),180px);width:var(--ds);height:var(--ds);flex:0 0 auto;background:var(--paper);border:4px solid var(--ink);border-radius:22%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:calc(var(--ds) * .13);gap:calc(var(--ds) * .05);box-shadow:0 6px 0 var(--ink)}
.die span{display:block;width:100%;height:100%;border-radius:50%}
.dnum{font-family:var(--display);font-size:clamp(34px,4vh,60px);line-height:1;min-height:1em;color:var(--ink);font-variant-numeric:tabular-nums}
.arena.win .dnum{color:var(--red)}
.die span.on{background:var(--ink)}
.arena.win .die span.on{background:var(--red)}
.dq{grid-column:1 / -1;grid-row:1 / -1;place-self:center;font-family:var(--display);font-weight:400;font-size:clamp(48px,7vh,90px);color:var(--line);line-height:1}
.die.rolling{animation:shake .16s infinite}
.die.land{animation:land .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes land{0%{transform:scale(1.35) rotate(-8deg)}100%{transform:scale(1)}}
@keyframes shake{0%{transform:rotate(-14deg) scale(1.03)}50%{transform:rotate(14deg)}100%{transform:rotate(-14deg) scale(1.03)}}
.picker{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.pk-label{font-weight:800;margin-bottom:8px}
.pk-label span{font-weight:400;color:var(--muted);font-size:.85em;margin-left:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 12px 4px 5px;cursor:pointer;font-weight:800;max-width:100%}
.chip img{height:28px;aspect-ratio:3/2;object-fit:cover;border-radius:5px;border:1.5px solid var(--ink);background:var(--paper);flex:0 0 auto}
.chip em{font-style:normal;font-size:.75em;background:var(--paper);border-radius:999px;padding:0 8px;color:var(--muted);border:1px solid var(--line)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.on em{color:var(--ink)}
.chip:disabled{opacity:.45;cursor:not-allowed}

/* rps */
.wins{display:flex;gap:8px}
.wins span{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper)}
.wins span.on{background:var(--gold)}
.hand-show{font-size:clamp(64px,min(13vh,10vw),150px);line-height:1;height:1.15em;display:grid;place-items:center}
.hand-show .dq{font-size:.7em}
.hands{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hbtn{display:flex;flex-direction:column;align-items:center;border:2.5px solid var(--ink);background:var(--soft);border-radius:14px;padding:6px 12px;cursor:pointer;font-weight:800;box-shadow:0 3px 0 var(--ink);min-width:4.4em}
.hbtn span{font-size:1.9em;line-height:1.15}
.hbtn.on{background:var(--yellow)}
.hbtn:disabled{opacity:.35;cursor:not-allowed}
.hbtn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#count{position:fixed;inset:0;display:grid;place-items:center;background:var(--scrim);z-index:50}
.cw{font-family:var(--display);font-size:clamp(90px,18vw,320px);animation:pop .45s ease-out both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* quiz */
.qcount{font-family:var(--display);font-size:1.6em;line-height:1}
.qcount small{font-size:.6em;color:var(--muted)}
.qcard{background:var(--paper);border:3px solid var(--ink);border-radius:26px;padding:clamp(18px,2.4vw,40px);text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.qtext{font-family:var(--display);font-size:clamp(30px,3.3vw,72px);line-height:1.2;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{display:flex;align-items:center;gap:16px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:clamp(10px,1.1vw,20px);min-width:0;transition:opacity .3s}
.opt b{flex:0 0 auto;width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;color:var(--paper);font-family:var(--display);font-weight:400;font-size:clamp(24px,2.2vw,50px)}
.opt span{font-family:var(--display);font-size:clamp(24px,2.3vw,52px);line-height:1.15;min-width:0;overflow-wrap:anywhere}
.o1 b{background:var(--red)}.o2 b{background:var(--yellow);color:var(--ink)}.o3 b{background:var(--blue)}.o4 b{background:var(--green)}
.opts.revealed .opt{opacity:.3}
.opts.revealed .opt.right{opacity:1;background:var(--goldsoft);border-color:var(--gold);box-shadow:0 0 0 5px var(--yellow)}
.opt .mark{margin-left:auto;font-family:var(--display);color:var(--green);font-size:clamp(22px,1.8vw,40px);white-space:nowrap}
.explain{font-size:clamp(18px,1.2vw + 8px,32px);font-weight:800}
.qactions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* coop */
.mission{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:stretch}
.mcard{background:var(--paper);border:3px solid var(--ink);border-radius:26px;padding:clamp(16px,2vw,32px);display:flex;flex-direction:column;gap:12px;min-width:0}
.mcard h2{font-size:clamp(32px,3.3vw,72px)}
.mdesc{font-size:clamp(18px,1.2vw + 7px,32px);max-width:40ch;line-height:1.45}
.need{font-weight:800;color:var(--red)}
.msteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:st}
.msteps li{counter-increment:st;display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:clamp(20px,1.3vw + 8px,34px);line-height:1.25}
.msteps li::before{content:counter(st);flex:0 0 auto;width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:var(--paper);font-size:.8em}
.topic{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--soft);border:2px dashed var(--blue);border-radius:16px;padding:10px 16px}
.topic span{font-weight:800;color:var(--blue)}
.topic strong{font-family:var(--display);font-weight:400;font-size:clamp(28px,2.6vw,58px)}
.msel{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--muted);font-size:.9em}
.msel select{border:2px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--paper);max-width:14em}
.tbox{background:var(--paper);border:3px solid var(--ink);border-radius:26px;padding:20px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.timer{position:relative;width:clamp(150px,22vh,260px);aspect-ratio:1}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.tr-bg{fill:none;stroke:var(--soft);stroke-width:12}
.tr-fg{fill:none;stroke:var(--blue);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.timer.done .tr-fg{stroke:var(--red)}
.tnum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tnum b{font-family:var(--display);font-weight:400;font-size:clamp(56px,9vh,110px);line-height:1;font-variant-numeric:tabular-nums}
.tnum small{font-weight:800;color:var(--muted)}
.timer.done .tnum b,.timer.done .tnum small{color:var(--red)}
.teams{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.team{background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center;min-width:0}
.team.ok{background:var(--greensoft);border-color:var(--green)}
.tlabel{font-family:var(--display);font-size:1.3em}
.tflags{display:flex;align-items:center;gap:6px;justify-content:center;width:100%}
.tflags figure{margin:0;flex:1 1 0;min-width:0;text-align:center}
.tflags figcaption{font-weight:800;font-size:.85em;margin-top:4px;overflow-wrap:anywhere}
.plus{font-family:var(--display);font-size:1.6em;color:var(--red)}
.tbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* awards */
.board-wrap{overflow-x:auto;background:var(--paper);border:3px solid var(--ink);border-radius:22px}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 14px;text-align:center;border-bottom:2px solid var(--soft)}
tbody tr:last-child td{border-bottom:0}
th{font-weight:800;color:var(--muted);font-size:.85em;letter-spacing:.04em}
th.l,td.nm{text-align:left}
.nmc{display:flex;align-items:center;gap:12px}
.nmc img{height:42px;aspect-ratio:3/2;object-fit:contain;border:2px solid var(--ink);border-radius:5px;background:var(--paper)}
.nmc strong{font-family:var(--display);font-weight:400;font-size:1.4em;display:block;line-height:1.1}
.nmc small{color:var(--muted);font-weight:700}
.adj{display:inline-flex;align-items:center;gap:10px}
.adj b{font-family:var(--display);font-weight:400;font-size:1.6em;min-width:1.2em;font-variant-numeric:tabular-nums}
.adj button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--soft);cursor:pointer;font-weight:800;line-height:1;padding:0;opacity:.45}
tr:hover .adj button,.adj button:focus-visible{opacity:1}
.total{font-family:var(--display);font-size:1.8em;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
.awardbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--ink);color:var(--paper);border-radius:22px;padding:18px 24px}
.awardbar h2{font-size:clamp(24px,2vw + 6px,44px)}
.awardbar p{opacity:.85}

/* award overlay */

/* ---------- flags ---------- */
const FC=['#E4473A','#F5C02E','#2C69D3','#249960','#FFFFFF','#1C2A44','#F08A24','#8C5AD3','#38B6C8','#F07AA4'];
const flagCache={};
function mul(seed){let t=(seed*2654435761)>>>0;return()=>{t=(t+0x6D2B79F5)>>>0;let r=Math.imul(t^(t>>>15),t|1);r^=r+Math.imul(r^(r>>>7),r|61);return((r^(r>>>14))>>>0)/4294967296;};}
function star(g,cx,cy,R,col){g.fillStyle=col;g.beginPath();for(let i=0;i<10;i++){const rr=i%2?R*.42:R;const a=-Math.PI/2+i*Math.PI/5;g.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a));}g.closePath();g.fill();}
function genFlag(seed){
 if(flagCache[seed])return flagCache[seed];
 const c=document.createElement('canvas');c.width=300;c.height=200;const g=c.getContext('2d');const r=mul(seed+1);
 const pick=ex=>{let col,k=0;do{col=FC[Math.floor(r()*FC.length)];k++;}while(ex.includes(col)&&k<50);return col;};
 const a=pick([]),b=pick([a]),d=pick([a,b]);const p=Math.floor(r()*6);
 const rect=(col,x,y,w,h)=>{g.fillStyle=col;g.fillRect(x,y,w,h);};
 if(p===0){rect(a,0,0,300,67);rect(b,0,67,300,67);rect(d,0,134,300,66);}
 else if(p===1){rect(a,0,0,100,200);rect(b,100,0,100,200);rect(d,200,0,100,200);}
 else if(p===2){rect(a,0,0,300,200);g.fillStyle=b;g.beginPath();g.arc(150,100,58,0,Math.PI*2);g.fill();}
 else if(p===3){rect(a,0,0,300,200);rect(d,0,160,300,40);star(g,150,88,62,b);}
 else if(p===4){rect(a,0,0,300,200);g.fillStyle=b;g.beginPath();g.moveTo(0,200);g.lineTo(300,0);g.lineTo(300,200);g.fill();g.fillStyle=d;g.beginPath();g.arc(78,62,32,0,Math.PI*2);g.fill();}
 else{rect(a,0,0,300,200);rect(b,88,0,44,200);rect(b,0,78,300,44);}
 return flagCache[seed]=c.toDataURL('image/png');
}
const flagSrc=n=>n.flag||genFlag(n.seed);
function readImage(file){
 return new Promise((res,rej)=>{
  if(!file||!/^image\//.test(file.type))return rej(new Error('type'));
  const fr=new FileReader();fr.onerror=()=>rej(fr.error);
  fr.onload=()=>{const img=new Image();img.onload=()=>{const max=640;let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#FFFFFF';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',.86));};img.onerror=()=>rej(new Error('img'));img.src=fr.result;};
  fr.readAsDataURL(file);
 });
}
async function setFlag(id,file){
 const n=N(id);if(!n)return;

}

/* ---------- sound & fx ---------- */
let ac=null;
function actx(){if(!S.sound)return null;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac;}catch(e){return null;}}
function tone(f,d,w,type,v){const a=actx();if(!a)return;d=d||.15;w=w||0;const t=a.currentTime+w;const o=a.createOscillator(),gn=a.createGain();o.type=type||'triangle';o.frequency.value=f;gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(v||.18,t+.02);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn).connect(a.destination);o.start(t);o.stop(t+d+.05);}
const sfx={
 tick:()=>tone(700+rnd(300),.05,0,'square',.04),
 roll:p=>tone(520+p*560,.05,0,'square',.05),
 land:()=>{tone(196,.3,0,'triangle',.32);tone(392,.18,.04,'triangle',.18);},
 pop:()=>tone(660,.12),
 boop:()=>{tone(392,.15);tone(330,.25,.15);},
 fanfare:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,i===3?.55:.18,i*.14));},
 bell:()=>{[0,1,2].forEach(i=>tone(1047,.3,i*.35,'sine',.25));}
};
function speak(t){if(!S.sound)return;try{const ss=window.speechSynthesis;if(!ss)return;ss.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.9;const v=ss.getVoices().find(x=>/^ko/i.test(x.lang));if(v)u.voice=v;ss.speak(u);}catch(e){}}
const reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
/* richer ceremony audio */
let master=null;
function out(a){if(!master){master=a.createDynamicsCompressor();master.threshold.value=-14;master.ratio.value=6;master.connect(a.destination);}return master;}
function noiseBuf(a){if(!noiseBuf.b){const n=a.sampleRate*2,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;noiseBuf.b=b;}return noiseBuf.b;}
function hit(a,t,dur,ft,f,q,v){const s=a.createBufferSource();s.buffer=noiseBuf(a);const fl=a.createBiquadFilter();fl.type=ft;fl.frequency.value=f;fl.Q.value=q;const g=a.createGain();g.gain.setValueAtTime(Math.max(v,.0002),t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl).connect(g).connect(out(a));s.start(t,Math.random()*1.5);s.stop(t+dur+.02);}
function boom(a,t,f,d,v){const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(f*1.6,t);o.frequency.exponentialRampToValueAtTime(f,t+.12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(out(a));o.start(t);o.stop(t+d+.05);}
function brass(a,f,t,d,v){const o=a.createOscillator(),o2=a.createOscillator(),fl=a.createBiquadFilter(),g=a.createGain();o.type='sawtooth';o2.type='sawtooth';o.frequency.value=f;o2.frequency.value=f*1.005;fl.type='lowpass';fl.frequency.setValueAtTime(f*1.5,t);fl.frequency.linearRampToValueAtTime(f*6,t+.07);fl.frequency.linearRampToValueAtTime(f*3,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.03);g.gain.setValueAtTime(v,t+d*.75);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(fl);o2.connect(fl);fl.connect(g).connect(out(a));o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05);}
function bell(a,f,t,d,v){const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(out(a));o.start(t);o.stop(t+d+.05);}
const show={
 drumroll(dur){const a=actx();if(!a)return;const t0=a.currentTime+.02;for(let t=0;t<dur;t+=.045){const p=t/dur;hit(a,t0+t,.07,'bandpass',1800,.8,.05+p*.3);if(rnd(3)===0)boom(a,t0+t,90,.08,.06+p*.12);}
  const te=t0+dur;hit(a,te,1.8,'highpass',3500,.4,.55);boom(a,te,55,1.0,.9);},
 fanfare(){const a=actx();if(!a)return;const t=a.currentTime+.03;const v=.1;
  [[392,0,.14],[523,.15,.14],[659,.3,.14],[784,.45,.38],[659,.86,.13],[784,1.0,.13]].forEach(n=>brass(a,n[0],t+n[1],n[2],v));
  [523,659,784,1047].forEach(f=>brass(a,f,t+1.15,1.5,.075));boom(a,t,70,.5,.6);boom(a,t+1.15,60,.9,.8);hit(a,t+1.15,1.4,'highpass',4000,.4,.3);
  [2093,2637,3136].forEach((f,i)=>bell(a,f,t+1.2+i*.09,.9,.08));},
 applause(dur,v){const a=actx();if(!a)return;const t0=a.currentTime+.05;const n=Math.round(dur*70);for(let i=0;i<n;i++){const x=Math.random();const env=Math.min(1,x*dur/.35)*(x>.55?Math.max(.05,(1-x)/.45):1);hit(a,t0+x*dur,.04+Math.random()*.05,'bandpass',900+Math.random()*2200,1.1,(v||.4)*env*(.5+Math.random()*.5));}},
 finale(){const a=actx();if(!a)return;const t=a.currentTime+.03;let at=0;
  [[523,.22],[659,.22],[784,.22],[1047,.44],[988,.22],[784,.22],[880,.22],[988,.44],[1047,.22],[1175,.22],[1319,.7]].forEach(n=>{brass(a,n[0],t+at,n[1]*.95,.1);if(at===0||n[1]>.4)boom(a,t+at,70,.4,.5);at+=n[1];});
  [523,659,784,1047,1319].forEach(f=>brass(a,f,t+at,2.2,.065));boom(a,t+at,55,1.4,.9);hit(a,t+at,2.2,'highpass',3500,.4,.5);
  for(let i=0;i<8;i++)bell(a,[1568,2093,2637,3136][i%4],t+at+.1+i*.11,.8,.07);}
};
/* confetti: shared particle pool so bursts can overlap */
const FX={ps:[],run:false};
function confetti(n,from){
 if(reduce)return;const c=$('#fx');if(!FX.run){c.width=innerWidth;c.height=innerHeight;}
 const W=c.width,H=c.height,cols=['#E4473A','#F5C02E','#2C69D3','#249960','#F07AA4','#8C5AD3'];n=n||150;from=from||'center';
 for(let i=0;i<n&&FX.ps.length<900;i++){let p;const r=Math.random;
  if(from==='left')p={x:-10,y:H*.75,vx:8+r()*16,vy:-14-r()*14,gr:.42};
  else if(from==='right')p={x:W+10,y:H*.75,vx:-8-r()*16,vy:-14-r()*14,gr:.42};
  else if(from==='top')p={x:r()*W,y:-20-r()*H*.5,vx:(r()-.5)*3,vy:2+r()*3,gr:.05};
  else p={x:W/2+(r()-.5)*W*.4,y:H*.4,vx:(r()-.5)*18,vy:-r()*17-4,gr:.45};
  p.s=7+r()*9;p.r=r()*6;p.vr=(r()-.5)*.3;p.c=cols[rnd(cols.length)];FX.ps.push(p);}
 if(!FX.run){FX.run=true;c.hidden=false;const g=c.getContext('2d');
  (function step(){g.clearRect(0,0,c.width,c.height);FX.ps=FX.ps.filter(p=>p.y<c.height+40&&p.x>-60&&p.x<c.width+60);
   FX.ps.forEach(p=>{p.vy+=p.gr;p.vx*=.99;if(p.gr<.1)p.vx+=Math.sin(p.y/40)*.08;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);g.restore();});
   if(FX.ps.length)requestAnimationFrame(step);else{g.clearRect(0,0,c.width,c.height);c.hidden=true;FX.run=false;}})();}
}

const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function dieFace(v){if(v==null)return '<b class="dq">?</b>';return Array.from({length:9},(_,k)=>`<span class="${PIPS[v].includes(k)?'on':''}"></span>`).join('');}
function arena(mode,side){
 const st=mode==='dice'?D:R;const n=N(st[side]);
 if(!n)return `<div class="arena empty"><div class="flagframe ph"><span>아래에서<br>나라를 골라 주세요</span></div><p class="aname">?</p></div>`;
 const won=mode==='dice'?D.result===side:R.match===side;
 let inner='';
 if(mode==='dice'){

 CATS.forEach(c=>{let best=null;ns.forEach(n=>{if(out[n.id])return;const v=sc(n.id)[c]||0;if(v<=0)return;const t=total(n.id);if(!best||v>best.v||(v===best.v&&t>best.t))best={id:n.id,v,t};});if(best)out[best.id]={title:CAT_AWARD[c][0],desc:CAT_AWARD[c][1]};});
 const sp=shuffle(SPECIALS);let k=0;
 ns.forEach(n=>{if(!out[n.id]){const s=sp[k++%sp.length];out[n.id]={title:s[0],desc:s[1]};}});

 if(mode==='dice'&&D.rolling)return;if(mode==='rps'&&R.phase==='count')return;
 let a=st.a,b=st.b;
 if(a===id)a=null;else if(b===id)b=null;else if(!a)a=id;else if(!b)b=id;else b=id;
 if(mode==='dice'){resetD();D.a=a;D.b=b;}else{resetR();R.a=a;R.b=b;}
 sfx.tick();render();
}
function randPair(mode){
 const ns=shuffle(S.nations).sort((x,y)=>(S.played[mode][x.id]||0)-(S.played[mode][y.id]||0));
 if(mode==='dice'){if(D.rolling)return;resetD();D.a=ns[0].id;D.b=ns[1].id;}else{if(R.phase==='count')return;resetR();R.a=ns[0].id;R.b=ns[1].id;}
 sfx.pop();render();
}
function bump(mode){const st=mode==='dice'?D:R;[st.a,st.b].forEach(id=>{S.played[mode][id]=(S.played[mode][id]||0)+1;});}
function rollSide(side,dur){
 if(D['v'+side]!=null||!D.a||!D.b||D.result||D.spin[side])return;
 D.rolling++;D.spin[side]=true;render();
 const fin=1+rnd(6);let delay=55,t=0;
 (function tick(){
  const p=Math.min(1,t/dur);
  const e=document.getElementById('die-'+side);
  if(e){e.innerHTML=dieFace(1+rnd(6));e.style.animationDuration=(0.14+p*0.5).toFixed(2)+'s';}
  sfx.roll(p);
  t+=delay;delay*=1.09;
  if(t<dur){setTimeout(tick,delay);return;}
  setTimeout(()=>{
   D.spin[side]=false;D['v'+side]=fin;sfx.land();
   const both=D.va!=null&&D.vb!=null;
   if(!both)D.rolling--;
   render();landFx(side);
   if(both)setTimeout(()=>{D.rolling--;judge();},1000);
  },delay);
 })();
}
function landFx(side){const e=document.getElementById('die-'+side);if(e){e.classList.remove('land');void e.offsetWidth;e.classList.add('land');}}
function rollBoth(){
 if(!D.a||!D.b||D.rolling||D.result)return;
 const left=['a','b'].filter(s=>D['v'+s]==null);
 if(left.length===1){rollSide(left[0],2800);return;}
 const first=rnd(2)?'a':'b',second=first==='a'?'b':'a';
 rollSide(first,2300);rollSide(second,3800);
}
function judge(){
 if(D.va==null||D.vb==null||D.result)return;
 if(D.va===D.vb){D.result='tie';render();sfx.boop();return;}
 D.result=D.va>D.vb?'a':'b';sc(D[D.result]).dice++;bump('dice');save();render();celebrate();
}
function countdown(words,done){
 const ov=$('#count');ov.hidden=false;let i=0;const cols=['var(--red)','var(--blue)','var(--green)'];
 (function next(){if(i>=words.length){ov.hidden=true;done();return;}ov.innerHTML=`<span class="cw" style="color:${cols[i%3]}">${esc(words[i])}</span>`;tone([523,659,880][i%3],.22);i++;setTimeout(next,700);})();
}
function rpsGo(){
 if(!R.a||!R.b)return;R.ha=R.hb=null;R.round=null;R.phase='count';render();
 countdown(['가위!','바위!','보!'],()=>{R.phase='choose';render();});
}
function hand(side,h){
 if(R.phase!=='choose')return;R['h'+side]=h;sfx.pop();
 if(!(R.ha&&R.hb)){render();return;}
 if(R.ha===R.hb){R.round='tie';R.phase='roundEnd';render();sfx.boop();return;}
 const w=BEATS[R.ha]===R.hb?'a':'b';R['w'+w]++;R.round=w;
 if(R['w'+w]>=2){R.match=w;R.phase='matchEnd';sc(R[w]).rps++;bump('rps');save();render();celebrate();}
 else{R.phase='roundEnd';render();tone(784,.2);}
}

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
 const a=el.dataset.act,id=el.dataset.id;
 switch(a){
  case 'nav':go(el.dataset.v);break;
  case 'sound':S.sound=!S.sound;save();renderTools();if(S.sound)sfx.pop();else{try{speechSynthesis.cancel();}catch(x){}}break;
  case 'fs':{let p=null;try{if(document.fullscreenElement){document.exitFullscreen();break;}p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}catch(x){}if(p&&p.catch)p.catch(()=>toast('이 화면에서는 전체 화면 버튼을 쓸 수 없어요. 키보드의 F11 키를 눌러 보세요.'));else if(!p)toast('이 화면에서는 전체 화면 버튼을 쓸 수 없어요. 키보드의 F11 키를 눌러 보세요.');break;}
  case 'pennant':S.cer=+el.dataset.i;go('ceremony');break;
  case 'newBlank':ask('예시 나라를 모두 지우고 빈 칸 8개로 새로 시작할까요? 지금까지 모은 별도 함께 지워져요.','새로 시작',()=>{S.nations=blankNations(8);S.cer=0;resetScores();render();renderBunting();});break;
  case 'addNation':{const k=S.nations.length;S.nations.push({id:'a'+Date.now().toString(36),name:(k+1)+'번 나라',kid:'',intro:'',flag:null,sample:false,seed:50+rnd(900)});S.coop=null;save();render();renderBunting();break;}
  case 'removeNation':{const n=N(id);if(!n)break;ask(`‘${n.name}’ 칸을 뺄까요? 이 나라의 별도 함께 사라져요.`,'빼기',()=>{S.nations=S.nations.filter(x=>x.id!==id);delete S.scores[id];S.coop=null;resetD();resetR();render();renderBunting();});break;}
  case 'clearFlag':{const n=N(id);if(n){n.flag=null;save();render();renderBunting();}break;}
  case 'cerPrev':S.cer=Math.max(0,S.cer-1);save();render();break;
  case 'cerNext':S.cer=Math.min(S.nations.length-1,S.cer+1);save();render();break;
  case 'cerGo':S.cer=+el.dataset.i;save();render();break;
  case 'cerCheer':celebrate();break;
  case 'cerSpeak':{const n=S.nations[S.cer];speak(`${n.name}! ${n.kid?'대표 친구 '+n.kid+'.':''} ${n.intro||''}`);break;}
  case 'pick':pick(el.dataset.mode,id);break;
  case 'randPair':randPair(el.dataset.mode);break;
  case 'rollOne':rollSide(el.dataset.side,2800);break;
  case 'rollBoth':rollBoth();break;
  case 'diceAgain':D.va=D.vb=null;D.result=null;render();rollBoth();break;
  case 'diceNext':resetD();render();break;
  case 'rpsGo':rpsGo();break;
  case 'hand':hand(el.dataset.side,el.dataset.h);break;
  case 'rpsNext':resetR();render();break;
  case 'qSpeak':{const q=QS[S.quiz.order[S.quiz.i]];speak(q.q+' '+q.o.map((o,k)=>(k+1)+'번, '+o).join('. '));break;}
  case 'qReveal':S.quiz.revealed=true;S.quiz.picked=[];save();render();sfx.fanfare();break;
  case 'qSkip':S.quiz.i++;S.quiz.revealed=false;S.quiz.picked=[];save();render();break;
  case 'qPick':{const p=S.quiz.picked;const j=p.indexOf(id);if(j>=0)p.splice(j,1);else p.push(id);sfx.tick();render();break;}
  case 'qAll':S.quiz.picked=S.nations.map(n=>n.id);render();break;
  case 'qAward':{const p=S.quiz.picked;p.forEach(x=>{sc(x).quiz++;});if(p.length){toast(p.length+'개 나라가 별을 받았어요!');confetti();}S.quiz.i++;S.quiz.revealed=false;S.quiz.picked=[];save();render();break;}
  case 'qRestart':S.quiz=null;ensureQuiz();save();render();break;
  case 'coopShuffle':S.coop.teams=makeTeams(S.nations.map(n=>n.id));S.coop.res={};save();render();sfx.pop();break;
  case 'mDraw':{const C=S.coop;let pool=MISSIONS.map((_,k)=>k).filter(k=>!C.used.includes(k)&&k!==C.m);if(!pool.length){C.used=[];pool=MISSIONS.map((_,k)=>k).filter(k=>k!==C.m);}setMission(pool[rnd(pool.length)]);break;}
  case 'topicNext':{const C=S.coop;let t;do{t=TOPICS[rnd(TOPICS.length)];}while(t===C.topic&&TOPICS.length>1);C.topic=t;save();render();sfx.pop();break;}
  case 'tToggle':tToggle();break;
  case 'tReset':tReset();break;
  case 'teamRes':{const C=S.coop,i=+el.dataset.i,v=el.dataset.v,prev=C.res[i],mem=C.teams[i];
   if(prev==='ok')mem.forEach(x=>{const s=sc(x);s.coop=Math.max(0,s.coop-1);});
   if(prev===v)delete C.res[i];else{C.res[i]=v;if(v==='ok')mem.forEach(x=>{sc(x).coop++;});}
   save();render();if(C.res[i]==='ok')celebrate();else if(C.res[i]==='no')sfx.boop();break;}
  case 'adj':{const s=sc(id),c=el.dataset.c;s[c]=Math.max(0,(s[c]||0)+(+el.dataset.d));save();render();break;}
  case 'scoreReset':ask('모든 나라의 별을 0개로 지울까요? 대결 횟수와 퀴즈 진행도 처음으로 돌아가요.','지우기',()=>{resetScores();render();});break;
  case 'awardStart':AW={list:computeAwards(),i:0,tok:0};$('#stageov').hidden=false;awShow();break;
  case 'awNext':AW.i++;awShow();break;
  case 'awClose':AW.tok++;$('#stageov').hidden=true;try{speechSynthesis.cancel();}catch(x){}break;
  case 'modalYes':{$('#modal').hidden=true;const f=modalFn;modalFn=null;if(f)f();save();break;}
  case 'modalNo':$('#modal').hidden=true;modalFn=null;break;
 }
});
document.addEventListener('input',e=>{
 const t=e.target;if(!t.dataset||!t.dataset.field)return;const n=N(t.dataset.id);if(!n)return;
 n[t.dataset.field]=t.value;n.sample=false;saveSoon();renderBunting();
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.file){const f=t.files&&t.files[0];if(f)setFlag(t.dataset.file,f);t.value='';}
 else if(t.id==='mSel'&&t.value!==''){setMission(+t.value);}
});
document.addEventListener('dragover',e=>{e.preventDefault();const z=e.target.closest&&e.target.closest('[data-drop]');document.querySelectorAll('.flagdrop.over').forEach(x=>{if(x!==z)x.classList.remove('over');});if(z)z.classList.add('over');});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over');});
document.addEventListener('drop',e=>{e.preventDefault();const z=e.target.closest&&e.target.closest('[data-drop]');document.querySelectorAll('.flagdrop.over').forEach(x=>x.classList.remove('over'));if(z&&e.dataTransfer&&e.dataTransfer.files[0])setFlag(z.dataset.drop,e.dataTransfer.files[0]);});
document.addEventListener('keydown',e=>{
 if(e.target.matches&&e.target.matches('input,select,textarea'))return;
 if(!$('#modal').hidden){if(e.key==='Escape'){$('#modal').hidden=true;modalFn=null;}return;}
 if(!$('#stageov').hidden){if(e.key==='ArrowRight'){const b=document.querySelector('#stageov [data-act="awNext"]');if(b)b.click();}if(e.key==='Escape')$('#stageov').hidden=true;return;}
 if(view==='ceremony'){if(e.key==='ArrowRight'&&S.cer<S.nations.length-1){S.cer++;save();render();}if(e.key==='ArrowLeft'&&S.cer>0){S.cer--;save();render();}}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==view&&VIEWS.some(v=>v[0]===h))go(h);});

function boot(){buildNav();renderTools();renderBunting();const h=location.hash.slice(1);view=VIEWS.some(v=>v[0]===h)?h:'setup';render();}
try{const hot=window.claude&&window.claude.hot;if(hot&&typeof hot.snapshot==='function')hot.snapshot(()=>({S}));}catch(e){}
function start(data){if(data&&data.S&&Array.isArray(data.S.nations)&&data.S.nations.length)S=data.S;boot();}
const hot=window.claude&&window.claude.hot;
if(hot&&typeof hot.ready==='function')hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
